name: Publicar aplicación en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar el sitio estático
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html
          touch sitio/.nojekyll
      - name: Empaquetar aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - name: Comprobar disponibilidad del paquete de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intento in $(seq 1 12); do
            total=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            if [ "$total" -gt 0 ]; then
              echo "Paquete github-pages disponible."
              exit 0
            fi
            echo "Esperando el registro del paquete de Pages (intento $intento)..."
            sleep 5
          done
          echo "No aparece el paquete github-pages en la API de GitHub."
          exit 1
      - name: Desplegar Macro Studio
        id: deployment
        uses: actions/deploy-pages@v4
