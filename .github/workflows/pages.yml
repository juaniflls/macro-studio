name: Publicar aplicación en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar el sitio estático
        run: |
          mkdir -p sitio
          cp index.html sitio/index.html
          touch sitio/.nojekyll
      - name: Empaquetar aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - name: Desplegar Macro Studio
        id: deployment
        uses: actions/deploy-pages@v4
