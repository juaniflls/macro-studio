name: Verificar Macro Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Ejecutar pruebas de regresión
        run: python tests/test_app.py
      - name: Guardar diagnósticos ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macro-studio-diagnostics
          path: tests/out/
          if-no-files-found: ignore
