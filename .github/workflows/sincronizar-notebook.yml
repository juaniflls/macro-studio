name: Generar y publicar Macro Studio desde el notebook

on:
  push:
    branches: [main]
    paths:
      - 'Macro_Studio_5_3_Notebook_Generador.ipynb'
      - 'scripts/capturar_vistas.py'
      - '.github/workflows/sincronizar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: macro-studio-notebook
  cancel-in-progress: false

jobs:
  regenerar-y-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas de ejecución
        run: |
          python -m pip install ipython -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Regenerar index.html y fuentes desde el notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          nb = json.loads(Path("Macro_Studio_5_3_Notebook_Generador.ipynb").read_text(encoding="utf-8"))
          env = {}
          for cell in nb["cells"]:
              if cell["cell_type"] == "code":
                  exec("".join(cell["source"]), env)
          html = Path("index.html")
          assert html.exists() and html.stat().st_size > 100000
          assert "macro studio" in html.read_text(encoding="utf-8").lower()
          Path("src/engine.js").write_text(env["MOTOR_ECONOMICO_JS"], encoding="utf-8")
          Path("src/app.js").write_text(env["APLICACION_JS"], encoding="utf-8")
          Path("src/styles.css").write_text(env["ESTILOS_CSS"], encoding="utf-8")
          Path("src/references.js").write_text(env["REFERENCIAS_JS"], encoding="utf-8")
          PY
      - name: Comprobar sintaxis
        run: |
          node --check src/engine.js
          node --check src/app.js
      - name: Ejecutar pruebas de regresión
        run: python tests/test_app.py
      - name: Crear ocho capturas actualizadas
        run: python scripts/capturar_vistas.py
      - name: Versionar archivos generados y capturas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/engine.js src/app.js src/styles.css src/references.js assets/screenshots/actuales
          if git diff --cached --quiet; then
            echo "Aplicación y capturas sincronizadas."
          else
            git commit -m "Sincronizar aplicación y galería visual de Macro Studio 5.3"
            git push
          fi
      - name: Solicitar despliegue en GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
      - name: Guardar diagnósticos ante fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-macro-studio-5-3
          path: tests/out/
          if-no-files-found: ignore
